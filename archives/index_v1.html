  <style>
    :root {
      --maxw: 1100px;
      --bg: #eef3f7;
      --card: #ffffff;
      --muted: #546e7a;
      --accent: #00796b;
      --accent-light: #26a69a;
      --border: #d0e2e8;
      --map-green: #2e7d32;
      --map-blue: #0277bd;
      --map-sand: #f1f8e9;
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Inter", Arial, sans-serif;
      margin: 0;
      background: var(--bg);
      color: #102a43;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, var(--map-blue), var(--accent));
      color: #fff;
      padding: 40px 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    header h1 { margin: 0; font-size: 26px; font-weight: 700; }
    header .meta { opacity: 0.9; margin-top: 6px; font-size: 15px; }

    nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 14px;
      background: var(--card);
      border-bottom: 2px solid var(--border);
    }

    nav button, nav a.btn-inline {
      background: var(--map-sand);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
      text-decoration: none;
      color: #102a43;
    }

    nav button:hover, nav a.btn-inline:hover {
      background: var(--accent-light);
      color: #fff;
      border-color: var(--accent-light);
    }

    nav button[aria-pressed="true"] {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .container {
      max-width: var(--maxw);
      margin: 30px auto;
      padding: 0 16px;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);

    h2 {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 18px;
      border-left: 4px solid var(--accent);
      padding-left: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    h3 { font-size: 16px; margin-bottom: 6px; color: var(--map-blue); }

    ul { margin-top: 6px; padding-left: 20px; }

    .grid {

      grid-template-columns: 1fr 350px;
      gap: 20px;
    }

    @media(max-width: 900px) {

    a { color: var(--map-blue); text-decoration: underline; }

    footer {
      text-align: center;
      margin: 30px 0 20px;
      color: var(--muted);
      font-size: 13px;
