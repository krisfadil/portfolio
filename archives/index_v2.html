    :root{
      --primary-color:#2563eb;
      --secondary-color:#1e40af;
      --text-color:#1f2937;
      --light-text:#6b7280;
      --background:#ffffff;
      --section-bg:#f3f4f6;
      --accent:#26a69a;
      --maxw:1100px;
      --nav-height:70px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{font-family:'Poppins',system-ui,Segoe UI,Roboto,Arial; margin:0;background:var(--background);color:var(--text-color);-webkit-font-smoothing:antialiased}

    /* NAVBAR */
    .navbar{position:fixed;top:0;left:0;right:0;height:var(--nav-height);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 20px;z-index:1000;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(15,23,42,0.04)}
    .nav-left{display:flex;align-items:center;gap:12px}
    .logo{font-weight:700;color:var(--primary-color);font-size:18px}
    .nav-center{display:flex;gap:18px;justify-content:center}
    .nav-link{color:var(--text-color);text-decoration:none;padding:8px 10px;border-radius:8px;font-weight:500}
    .nav-link:hover{background:rgba(37,99,235,0.08)}
    .nav-right{display:flex;justify-content:flex-end;gap:8px}
    .lang-btn{padding:8px 10px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer}
    .lang-btn.active{border-color:var(--primary-color);background:rgba(37,99,235,0.08)}
    @media(max-width:900px){.nav-center{display:none}.navbar{grid-template-columns:1fr auto}}

    main{padding-top:calc(var(--nav-height) + 20px)}

    /* HERO */
    .hero{min-height:calc(100vh - var(--nav-height));display:flex;align-items:center;justify-content:center;position:relative;padding:40px;background:linear-gradient(135deg,#f0f9ff 0%,#e0f2fe 100%);overflow:hidden}
    .hero-inner{max-width:var(--maxw);width:100%;display:grid;grid-template-columns:1fr 380px;gap:28px;align-items:center;padding:40px}
    @media(max-width:900px){.hero-inner{grid-template-columns:1fr;padding:20px}}
    .hero-text h1{font-size:clamp(28px,4vw,44px);margin:0 0 12px}
    .hero-text p{margin:0 0 16px;color:var(--light-text)}
    .hero-ctas{display:flex;gap:12px}
    .btn-primary{background:var(--primary-color);color:#fff;padding:12px 16px;border-radius:10px;border:0;cursor:pointer}
    .btn-ghost{background:transparent;border:1px solid rgba(15,23,42,0.08);padding:12px 16px;border-radius:10px;cursor:pointer}

    /* Floating tech icons */
    .float-icon{position:absolute;opacity:0;animation:floatAnim linear infinite}
    @keyframes floatAnim{0%{transform:translateY(0) rotate(0deg);opacity:0}10%{opacity:1}50%{transform:translateY(-20px) rotate(200deg)}90%{opacity:0}100%{opacity:0}}

    /* ABOUT */
    .section{padding:60px 20px;background:var(--section-bg)}
    .container{max-width:var(--maxw);margin:0 auto}
    .about{display:grid;grid-template-columns:340px 1fr;gap:28px;align-items:center}
    @media(max-width:900px){.about{grid-template-columns:1fr}}
    .avatar{width:300px;height:300px;border-radius:50%;overflow:hidden;border:4px solid var(--primary-color);box-shadow:0 8px 30px rgba(2,6,23,0.08)}
    .avatar img{width:100%;height:100%;object-fit:cover;display:block}
    .avatar:hover{transform:translateY(-6px);transition:transform .25s}
    .about p{color:var(--light-text)}

    /* TIMELINE */
    .timeline{position:relative;padding:40px 0}
    .timeline::before{content:'';position:absolute;left:50%;top:0;transform:translateX(-50%);width:4px;height:100%;background:linear-gradient(180deg,var(--primary-color),var(--secondary-color));border-radius:4px}
    .timeline-item{position:relative;width:50%;padding:20px 30px}
    .timeline-item.left{left:0;text-align:right}
    .timeline-item.right{left:50%}
    .timeline-item .card{display:inline-block;text-align:left}
    .timeline-dot{position:absolute;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;background:var(--primary-color);border:4px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,0.12)}
    @media(max-width:900px){.timeline::before{left:20px;transform:none}.timeline-item{width:100%;padding-left:50px;padding-right:20px}.timeline-item.left,.timeline-item.right{left:0;text-align:left}.timeline-dot{left:28px}}

    /* PROJECTS */
    .projects-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    @media(max-width:1100px){.projects-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:700px){.projects-grid{grid-template-columns:1fr}}
    .project-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(2,6,23,0.06);transition:transform .25s,box-shadow .25s}
    .project-card:hover{transform:translateY(-10px);box-shadow:0 18px 50px rgba(2,6,23,0.12)}
    .project-media{position:relative;height:0;padding-bottom:56.25%;overflow:hidden}
    .project-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
    .project-card:hover .project-media img{transform:scale(1.06)}
    .project-body{padding:16px}
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .tag{padding:6px 10px;border-radius:999px;background:rgba(15,23,42,0.05);font-size:13px}
    .project-cta{display:inline-flex;align-items:center;gap:8px;margin-top:12px;color:var(--primary-color);text-decoration:none}

    /* STACK */
    .stack-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    @media(max-width:900px){.stack-grid{grid-template-columns:repeat(2,1fr)}}
    .stack-item{background:#fff;border-radius:10px;padding:18px;text-align:center;box-shadow:0 6px 18px rgba(2,6,23,0.06);transition:transform .2s}
    .stack-item:hover{transform:translateY(-6px)}

    /* CONTACT */
    .contact-center{text-align:center}
    .contact-buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}
    .contact-btn{padding:12px 18px;border-radius:10px;border:0;cursor:pointer}
    .btn-email{background:var(--primary-color);color:#fff}
    .btn-linkedin{background:transparent;border:1px solid rgba(15,23,42,0.08)}

    /* FOOTER */
    footer{padding:28px 16px;text-align:center;color:var(--light-text);background:transparent}

    /* Animations & reveal */
    .fade-up{opacity:0;transform:translateY(12px);transition:opacity .6s ease,transform .6s ease}
    .fade-up.in-view{opacity:1;transform:none}
  </style>

      return nav.startsWith('en') ? 'en' : 'fr';
    }

    function applyTranslations(lang){
      const t = translations[lang] || translations.fr;
      // meta
      document.title = t.meta.title;
      document.querySelector('meta[name="description"]').setAttribute('content', t.meta.description);
      // static data-i18n elements
      document.querySelectorAll('[data-i18n]').forEach(el=>{
        const key = el.getAttribute('data-i18n');
        const parts = key.split('.');
        let val = t;
        for(const p of parts){ val = val[p]; if(!val) break; }
        if(val) el.textContent = val;
      });
    }

    function createTimeline(lang){
      const container = document.getElementById('timeline');
      container.innerHTML = '';
      DATA.experience.forEach((item, idx)=>{
        const side = (idx%2===0)?'left':'right';
        const el = document.createElement('div');
        el.className = `timeline-item ${side} fade-up`;
        const dot = document.createElement('div'); dot.className='timeline-dot'; el.appendChild(dot);
        const card = document.createElement('div'); card.className='card';
        const title = document.createElement('h3'); title.textContent = lang==='fr' ? item.title_fr : item.title_en; card.appendChild(title);
        const meta = document.createElement('div'); meta.className='meta'; meta.textContent = `${item.company} • ${item.period}`; card.appendChild(meta);
        const ul = document.createElement('ul');
        const bullets = lang==='fr' ? item.bullets_fr : item.bullets_en;
        bullets.forEach(b=>{ const li=document.createElement('li'); li.textContent=b; ul.appendChild(li); });
        card.appendChild(ul);
        el.appendChild(card);
        container.appendChild(el);
      });
    }

    function createProjects(lang){
      const container = document.getElementById('projects-grid'); container.innerHTML='';
      DATA.projects.forEach(p=>{
        const card = document.createElement('article'); card.className='project-card fade-up';
        const media = document.createElement('div'); media.className='project-media';
        const img = document.createElement('img'); img.src = p.img; img.alt = lang==='fr' ? p.title_fr : p.title_en; media.appendChild(img);
        card.appendChild(media);
        const body = document.createElement('div'); body.className='project-body';
        const h4 = document.createElement('h3'); h4.textContent = lang==='fr' ? p.title_fr : p.title_en; body.appendChild(h4);
        const pdesc = document.createElement('p'); pdesc.style.color = 'var(--light-text)'; pdesc.textContent = lang==='fr' ? p.desc_fr : p.desc_en; body.appendChild(pdesc);
        const tags = document.createElement('div'); tags.className='tags'; p.tags.forEach(tag=>{ const t=document.createElement('span'); t.className='tag'; t.textContent=tag; tags.appendChild(t); }); body.appendChild(tags);
        const cta = document.createElement('a'); cta.className='project-cta'; cta.href=p.link; cta.target='_blank'; cta.rel='noopener'; cta.innerHTML = (lang==='fr' ? 'Voir le projet' : 'View project') + ' <i class="fa fa-arrow-right" style="margin-left:6px"></i>';
        body.appendChild(cta);
        card.appendChild(body);
        container.appendChild(card);
      });
    }

    function createStack(lang){
      const container = document.getElementById('stack-grid'); container.innerHTML='';
      DATA.stack.forEach(s=>{
        const item = document.createElement('div'); item.className='stack-item fade-up';
        const icon = document.createElement('div'); icon.innerHTML = `<i class="${s.icon}" style="font-size:22px;color:var(--primary-color)"></i>`;
        const label = document.createElement('div'); label.style.marginTop='10px'; label.textContent = s.name;
        item.appendChild(icon); item.appendChild(label);
        container.appendChild(item);
      });
    }

    /* Floating icons in hero */
    const techIcons = [
      {icon:'fa-brands fa-python', color:'#3070a9', size:40},
      {icon:'fa-solid fa-map', color:'#16a34a', size:34},
      {icon:'fa-brands fa-r-project', color:'#276749', size:38},
      {icon:'fa-solid fa-database', color:'#6b21a8', size:30},
      {icon:'fa-solid fa-chart-line', color:'#ea580c', size:36}
    ];

    function createFloatingIcons(){
      const container = document.getElementById('floating-icons'); container.innerHTML='';
      for(let i=0;i<8;i++){
        const cfg = techIcons[Math.floor(Math.random()*techIcons.length)];
        const el = document.createElement('div'); el.className='float-icon';
        el.style.left = Math.random()*80 + '%';
        el.style.top = Math.random()*80 + '%';
        el.style.fontSize = (cfg.size + Math.random()*20) + 'px';
        el.style.color = cfg.color; el.style.animationDuration = (6+Math.random()*8)+'s';
        el.innerHTML = `<i class="${cfg.icon}"></i>`;
        container.appendChild(el);
      }
    }

    /* Intersection Observer for fade-up reveal */
    function initObservers(){
      const obs = new IntersectionObserver(entries=>{
        entries.forEach(entry=>{
          if(entry.isIntersecting){ entry.target.classList.add('in-view'); entry.target.classList.add('in-view'); entry.target.classList.add('in-view'); entry.target.classList.add('in-view'); entry.target.classList.remove('fade-up'); }
        });
      },{threshold:0.12});
      document.querySelectorAll('.fade-up').forEach(el=>obs.observe(el));
    }

    /* Typing effect for hero greeting */
    function typeText(el, text, speed=50){
      el.textContent=''; let i=0; const timer = setInterval(()=>{ el.textContent += text.charAt(i); i++; if(i>text.length-1) clearInterval(timer); }, speed);
    }

    /* Set UI language, create content, init animations */
    function setLanguage(lang){
      currentLang = lang;
      localStorage.setItem('lang', lang);
      applyTranslations(lang);
      createTimeline(lang);
      createProjects(lang);
      createStack(lang);
      createFloatingIcons();
      // typing
      const greeting = translations[lang].hero.greeting;
      typeText(document.getElementById('hero-greeting'), greeting, 40);
      // set hero title and location
      document.getElementById('hero-title').textContent = translations[lang].hero.title;
      document.getElementById('hero-location').textContent = translations[lang].hero.location;
      // set CTAs
      document.getElementById('cta-contact').textContent = translations[lang].hero.ctaContact;
      document.getElementById('cta-work').textContent = translations[lang].hero.ctaWork;

      // apply active lang button styles
      document.querySelectorAll('.lang-btn').forEach(btn=>btn.classList.remove('active'));
      document.getElementById('btn-fr').classList.toggle('active', lang==='fr');
      document.getElementById('btn-en').classList.toggle('active', lang==='en');

      // update static about texts
      document.getElementById('about-p1').textContent = translations[lang].about.p1;
      document.getElementById('about-p2').textContent = translations[lang].about.p2;

      // run observers after small timeout to allow DOM update
      setTimeout(()=>initObservers(), 200);
    }

    // Hook buttons
    document.addEventListener('DOMContentLoaded', ()=>{
      // language detection
      const detected = detectLang();
      document.getElementById('btn-fr').addEventListener('click', ()=>setLanguage('fr'));
      document.getElementById('btn-en').addEventListener('click', ()=>setLanguage('en'));
      // set initial language
      setLanguage(detected);
      // year
      document.getElementById('year').textContent = new Date().getFullYear();
    });
  </script>
</body>
</html>
